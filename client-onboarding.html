<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Get Started | Tulse</title>
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <style>
        .onboarding-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            padding: 20px;
        }

        .onboarding-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
        }

        .onboarding-container .logo {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 10px;
        }

        .onboarding-container .logo span {
            color: var(--accent-color, #ff6b35);
        }

        .onboarding-container .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent-color, #ff6b35);
            box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color, #ff6b35);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,107,53,0.3);
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #718096;
        }

        .login-link a {
            color: var(--accent-color, #ff6b35);
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fed7d7;
            color: #9b2c2c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle input {
            padding-right: 45px;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #718096;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .package-select {
            margin-bottom: 25px;
        }

        .package-select label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .package-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .package-option {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .package-option:hover {
            border-color: var(--accent-color, #ff6b35);
        }

        .package-option.selected {
            border-color: var(--accent-color, #ff6b35);
            background: #fff5f0;
        }

        .package-option input[type="radio"] {
            display: none;
        }

        .package-option .package-name {
            font-weight: 700;
            color: #1a202c;
        }

        .package-option .package-price {
            font-size: 0.85rem;
            color: #718096;
        }

        .no-payment-badge {
            background: #c6f6d5;
            color: #22543d;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
            border: 2px solid #38a169;
        }

        @media (max-width: 480px) {
            .onboarding-container {
                padding: 30px 20px;
            }
            .package-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="onboarding-page">
    <div class="onboarding-container">
        <div class="logo">Tulse<span>.</span></div>
        <p class="subtitle">Create your account and get started</p>

        <!-- No Payment Required Notice -->
        <div class="no-payment-badge">
            <i class="fas fa-check-circle"></i> No payment required to create your account
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe" required />
            </div>

            <div class="form-group">
                <label for="company">Company Name (Optional)</label>
                <input type="text" id="company" placeholder="Your company" />
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
                <label for="phone">Phone Number (Optional)</label>
                <input type="tel" id="phone" placeholder="+1 (555) 000-0000" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-toggle">
                    <input type="password" id="password" placeholder="Min 6 characters" required minlength="6" />
                    <button type="button" class="toggle-btn" onclick="togglePassword()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
            </div>

            <div class="package-select">
                <label>Select Package</label>
                <div class="package-options">
                    <label class="package-option selected">
                        <input type="radio" name="package" value="starter" checked />
                        <div class="package-name">Starter</div>
                        <div class="package-price">Free</div>
                    </label>
                    <label class="package-option">
                        <input type="radio" name="package" value="growth" />
                        <div class="package-name">Growth</div>
                        <div class="package-price">$99/mo</div>
                    </label>
                    <label class="package-option">
                        <input type="radio" name="package" value="professional" />
                        <div class="package-name">Professional</div>
                        <div class="package-price">$249/mo</div>
                    </label>
                    <label class="package-option">
                        <input type="radio" name="package" value="enterprise" />
                        <div class="package-name">Enterprise</div>
                        <div class="package-price">Custom</div>
                    </label>
                </div>
            </div>

            <button type="submit" class="register-btn" id="registerBtn">
                Create Account
            </button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/client-login.html">Sign In</a>
        </div>
    </div>
</div>

<!-- Firebase Import Map -->
<script type="importmap">
{
    "imports": {
        "firebase": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
    }
}
</script>

<script type="module">
import { registerUser } from './js/firebase/auth.js';

const form = document.getElementById('registerForm');
const fullNameInput = document.getElementById('fullName');
const companyInput = document.getElementById('company');
const emailInput = document.getElementById('email');
const phoneInput = document.getElementById('phone');
const passwordInput = document.getElementById('password');
const confirmInput = document.getElementById('confirmPassword');
const registerBtn = document.getElementById('registerBtn');
const errorDiv = document.getElementById('errorMessage');
const successDiv = document.getElementById('successMessage');

// Package selection UI
document.querySelectorAll('.package-option').forEach(option => {
    option.addEventListener('click', function() {
        document.querySelectorAll('.package-option').forEach(o => o.classList.remove('selected'));
        this.classList.add('selected');
        this.querySelector('input[type="radio"]').checked = true;
    });
});

function showError(message) {
    errorDiv.textContent = message;
    errorDiv.classList.add('show');
    successDiv.classList.remove('show');
}

function showSuccess(message) {
    successDiv.textContent = message;
    successDiv.classList.add('show');
    errorDiv.classList.remove('show');
}

function hideMessages() {
    errorDiv.classList.remove('show');
    successDiv.classList.remove('show');
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessages();

    const fullName = fullNameInput.value.trim();
    const company = companyInput.value.trim();
    const email = emailInput.value.trim();
    const phone = phoneInput.value.trim();
    const password = passwordInput.value;
    const confirm = confirmInput.value;

    // Validation
    if (!fullName || !email || !password) {
        showError('Please fill in all required fields.');
        return;
    }

    if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
    }

    if (password !== confirm) {
        showError('Passwords do not match.');
        return;
    }

    // Get selected package
    const packageRadio = document.querySelector('input[name="package"]:checked');
    const packageValue = packageRadio ? packageRadio.value : 'starter';

    registerBtn.disabled = true;
    registerBtn.innerHTML = '<span class="spinner"></span> Creating account...';

    const result = await registerUser(email, password, {
        fullName: fullName,
        company: company,
        phone: phone,
        package: packageValue,
        role: 'client'
    });

    registerBtn.disabled = false;
    registerBtn.innerHTML = 'Create Account';

    if (result.success) {
        showSuccess('Account created successfully! Redirecting to dashboard...');
        // Clear any old session data
        localStorage.removeItem('tulse_session_id');
        localStorage.removeItem('tulse_payment_verified');
        localStorage.removeItem('tulse_package');
        localStorage.removeItem('tulse_purchase_time');
        
        setTimeout(() => {
            window.location.href = '/client-dashboard.html';
        }, 1500);
    } else {
        showError(result.error || 'Registration failed. Please try again.');
    }
});

// Password visibility toggle
window.togglePassword = function() {
    const password = document.getElementById('password');
    const eye = document.getElementById('eyeIcon');
    if (password.type === 'password') {
        password.type = 'text';
        eye.className = 'fas fa-eye-slash';
    } else {
        password.type = 'password';
        eye.className = 'fas fa-eye';
    }
};

console.log('✅ Onboarding page loaded - No payment required');
</script>

</body>
</html>
