<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | Tulse</title>
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 440px;
        }

        .login-container .logo {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 10px;
        }

        .login-container .logo span {
            color: var(--accent-color, #ff6b35);
        }

        .login-container .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color, #ff6b35);
            box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color, #ff6b35);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,107,53,0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #718096;
        }

        .register-link a {
            color: var(--accent-color, #ff6b35);
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fed7d7;
            color: #9b2c2c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle input {
            padding-right: 45px;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #718096;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .forgot-password {
            text-align: right;
            margin-top: 8px;
        }

        .forgot-password a {
            color: #718096;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .forgot-password a:hover {
            color: var(--accent-color, #ff6b35);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<div class="login-page">
    <div class="login-container">
        <div class="logo">Tulse<span>.</span></div>
        <p class="subtitle">Sign in to your account</p>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-toggle">
                    <input type="password" id="password" placeholder="Enter your password" required />
                    <button type="button" class="toggle-btn" onclick="togglePassword()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="forgot-password">
                <a href="#" onclick="handleForgotPassword(event)">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Sign In
            </button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="/client-onboarding.html">Get Started</a>
        </div>
    </div>
</div>

<!-- Firebase Import Map -->
<script type="importmap">
{
    "imports": {
        "firebase": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
    }
}
</script>

<script type="module">
import { loginUser, resetPassword } from './js/firebase/auth.js';

const form = document.getElementById('loginForm');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const errorDiv = document.getElementById('errorMessage');
const successDiv = document.getElementById('successMessage');

function showError(message) {
    errorDiv.textContent = message;
    errorDiv.classList.add('show');
    successDiv.classList.remove('show');
}

function showSuccess(message) {
    successDiv.textContent = message;
    successDiv.classList.add('show');
    errorDiv.classList.remove('show');
}

function hideMessages() {
    errorDiv.classList.remove('show');
    successDiv.classList.remove('show');
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessages();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        showError('Please fill in all fields.');
        return;
    }

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner"></span> Signing in...';

    const result = await loginUser(email, password);

    loginBtn.disabled = false;
    loginBtn.innerHTML = 'Sign In';

    if (result.success) {
        showSuccess('Login successful! Redirecting...');
        setTimeout(() => {
            if (result.userData?.role === 'admin') {
                window.location.href = '/admin-dashboard.html';
            } else {
                window.location.href = '/client-dashboard.html';
            }
        }, 1000);
    } else {
        showError(result.error || 'Login failed. Please try again.');
    }
});

// Password visibility toggle
window.togglePassword = function() {
    const password = document.getElementById('password');
    const eye = document.getElementById('eyeIcon');
    if (password.type === 'password') {
        password.type = 'text';
        eye.className = 'fas fa-eye-slash';
    } else {
        password.type = 'password';
        eye.className = 'fas fa-eye';
    }
};

// Forgot password
window.handleForgotPassword = async function(e) {
    e.preventDefault();
    const email = emailInput.value.trim();

    if (!email) {
        showError('Please enter your email address first.');
        return;
    }

    hideMessages();
    const result = await resetPassword(email);

    if (result.success) {
        showSuccess('Password reset email sent! Check your inbox.');
    } else {
        showError(result.error || 'Failed to send reset email. Try again.');
    }
};

console.log('✅ Login page loaded');
</script>

</body>
</html>
